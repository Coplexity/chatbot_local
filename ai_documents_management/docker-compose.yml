services:
  db:
    image: pgvector/pgvector:pg16
    container_name: guideline-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-guideline_management}
    ports:
      - "${DB_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-guideline_management}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guideline-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      HOST: "0.0.0.0"
      PORT: "8000"
      LOCAL_STORAGE_ROOT: /app/uploads
      # (***) Comment out DB_HOST & DB_PORT to allow reading from .env (for Supabase connection)
      # DB_HOST: db
      # DB_PORT: "5432"
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads

  frontend:
    image: node:20
    container_name: guideline-frontend
    working_dir: /app
    volumes:
      - ./web:/app
    ports:
      - "5173:5173"
    environment:
      - API_URL=http://backend:8000
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend

volumes:
  postgres_data:
